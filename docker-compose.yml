# The account server: PostgreSQL and the server. Copy .env.example to .env and fill it in, then
#   docker compose up -d --build                    on this computer: http://localhost:5080
#   docker compose --profile https up -d --build    on a VPS: adds Caddy in front for HTTPS (iPhones refuse plain HTTP)
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kotw
      POSTGRES_USER: kotw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotw -d kotw"]
      interval: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Db: Host=db;Database=kotw;Username=kotw;Password=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5080:8080" # this machine only; players come in through Caddy
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-set-DOMAIN-in-.env} --to server:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - server

volumes:
  db:
  caddy:
